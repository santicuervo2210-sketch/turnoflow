<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "TurnoFlow" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg app-navbar">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/admin">TurnoFlow</a>
        <div class="navbar-nav flex-row gap-2">
          {% if is_owner_view %}
            <a class="nav-link" href="/owner">Owner</a>
          {% endif %}
          <a class="nav-link" href="/admin">Gestion</a>
          <a class="nav-link" href="/customer">Cliente</a>
          {% if is_owner_view %}
            <a class="nav-link" href="/docs">API</a>
          {% endif %}
          {% if current_user %}
            <a class="nav-link" href="/logout">Salir</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container-fluid px-4 py-4">
      {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
      {% endif %}
      {% if notice %}
        <div class="alert alert-success" role="alert">{{ notice }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
