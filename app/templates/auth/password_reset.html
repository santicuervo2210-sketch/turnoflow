{% extends "base.html" %}

{% block content %}
<div class="login-shell">
  <section class="login-card">
    <span class="stat-label">Recuperar acceso</span>
    <h1 class="h4 mb-2">Cambiar clave</h1>
    <p class="text-secondary">El link es temporal. Carga una clave nueva para volver a entrar.</p>
    <form action="/password-reset" method="post" class="d-grid gap-3">
      <input type="hidden" name="token" value="{{ token }}">
      <div>
        <label class="form-label">Nueva clave</label>
        <input class="form-control" type="password" name="password" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary" type="submit">Cambiar clave</button>
    </form>
  </section>
</div>
{% endblock %}
