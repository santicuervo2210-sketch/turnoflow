{% extends "base.html" %}

{% block content %}
<div class="login-shell">
  <section class="login-card">
    <span class="stat-label">Acceso privado</span>
    <h1 class="h4 mb-2">Entrar a TurnoFlow</h1>
    <p class="text-secondary">Usa el usuario y clave configurados para esta demo.</p>
    <form action="/login" method="post" class="d-grid gap-3">
      <input type="hidden" name="next_path" value="{{ next_path }}">
      <div>
        <label class="form-label">Usuario</label>
        <input class="form-control" name="username" autocomplete="username" required>
      </div>
      <div>
        <label class="form-label">Clave</label>
        <input class="form-control" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
  </section>
</div>
{% endblock %}
