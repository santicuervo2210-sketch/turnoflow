{% extends "base.html" %}

{% block content %}
<div class="admin-shell mx-auto" style="max-width: 760px;">
  <section class="page-head">
    <span class="stat-label">Acceso temporal</span>
    <h1 class="h3 mb-1">Cambiar clave de {{ user.username }}</h1>
    <p class="text-secondary mb-0">Este enlace vence en una hora y solo permite definir una nueva clave.</p>
  </section>
  <section class="bg-white border rounded-2 p-3">
    <label class="form-label" for="resetUrl">Enlace para enviar al cliente</label>
    <input class="form-control" id="resetUrl" value="{{ reset_url }}" readonly>
    <div class="d-flex flex-wrap gap-2 mt-3">
      <button class="btn btn-primary" type="button" onclick="navigator.clipboard.writeText(document.getElementById('resetUrl').value)">Copiar enlace</button>
      <a class="btn btn-outline-primary" href="{{ reset_url }}">Abrir enlace</a>
      <a class="btn btn-outline-secondary" href="/owner">Volver a usuarios</a>
    </div>
  </section>
</div>
{% endblock %}
